# Central Planner CI — a fast required gate, plus the browser UI suites beside it.
#
# Why it is split (measured 2026-08-18): of 110 app test files, the 55 browser
# `ui.*` suites were 94% of the wall clock (961 s of 1026 s locally; ~15.5 of
# the 16.5 minutes the old single job took) and every CI failure came from
# them — a different subset each run, i.e. mount/timing flake on a shared
# runner rather than regression. The other 55 files run ~700 tests in ~15 s.
# Splitting them gives a gate fast enough to trust and keeps the UI coverage
# visible without letting its flake block a push.
#
# Why the gate stays on macOS and only the UI job moved to Ubuntu: macOS
# minutes bill at 10x, and the UI suites are where the time is — they run in
# ~4.5 min on Ubuntu against ~16 min on macOS, so moving them is where the
# saving lives. The gate is ~1 min either way, and it exercises the process
# table (`jobs.*`) and native fs watchers (`watchers.*`), which are genuinely
# platform-shaped: two detached-job discovery tests fail under procps `ps`
# even after the -ax/-A fix in lib/jobs.js. Running the gate on the platform
# the product actually targets is worth ~1 macOS minute a push, and keeps
# product code from being contorted to suit a runner it never runs on.
#
# Billing safety: CP_NO_BILLED=1 is exported at the workflow level as
# belt-and-braces (the test sandbox already sets it server-side), and no
# ANTHROPIC_API_KEY — or any other secret — is configured anywhere here, so CI
# is structurally incapable of billed Claude dispatch.
#
# Chrome: the UI harness (app/test/uiHarness.mjs) resolves the browser from
# CP_CHROME and SKIPS its suites when that path is missing. A silent skip reads
# as a pass, so both jobs assert the binary first and fail loudly instead.
#
# Known gap (documented in the phase-2 audit, tests deliberately not edited):
# static.test.mjs syntax-checks a fixed file list that omits the 14 public
# modules added by the phase-2 decomposition — a module-load regression there
# surfaces as mass UI-test failure rather than a pointed syntax error.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CP_NO_BILLED: "1"

jobs:
  # The gate. Everything except the browser UI suites: ~700 tests in seconds.
  fast:
    name: Fast suite
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CP_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # latex.monarch.test.mjs is not a ui.* file but does drive a browser.
      - name: Assert Chrome is present
        run: |
          test -x "$CP_CHROME" || {
            echo "::error::No Chrome at $CP_CHROME — latex.monarch would skip silently"; exit 1; }

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: App suite (no browser UI suites)
        working-directory: app
        run: npm run test:fast

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # No npm ci: lifecycle.test.mjs imports only node: builtins and
      # serverlink.js, which imports only node: builtins. Installing would
      # download Electron (~325 MB of node_modules) to load none of it — and
      # setup-node's cache does not cover the Electron binary anyway.
      - name: Desktop suite
        working-directory: desktop
        run: npm test

  # Beside the gate, not in it. NOTE: job-level `continue-on-error` is the
  # wrong tool here — it keeps the workflow RUN green but still publishes a
  # check-run with conclusion=failure, and the commit badge follows the worst
  # check, so the commit goes red anyway. Instead the suite's exit code is
  # absorbed inside the step and the outcome is written to the run summary:
  # green check, visible warning, no silent skip. Delete the absorption (and
  # the `|| true` path) once the mount/timing flake is fixed and this is
  # trustworthy as a blocker.
  ui:
    name: Browser UI suites (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CP_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Assert Chrome is present
        run: |
          test -x "$CP_CHROME" || {
            echo "::error::No Chrome at $CP_CHROME — the UI suites would skip and report success"; exit 1; }

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: UI suites
        working-directory: app
        shell: bash
        run: |
          set +e
          npm run test:ui 2>&1 | tee /tmp/ui.log
          code=${PIPESTATUS[0]}
          {
            if [ "$code" -eq 0 ]; then
              echo "### Browser UI suites passed"
            else
              echo "### Browser UI suites FAILED — advisory, not blocking"
              echo
              echo 'These suites are known-flaky on shared runners (mount/timing races).'
              echo 'The gate is the Fast suite; this job reports but does not block.'
              echo
              echo '```'
              grep -E '^not ok [0-9]+' /tmp/ui.log | head -25
              grep -E '^# (tests|pass|fail|skipped)' /tmp/ui.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
